<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 240px;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background: #1e1f22;
    color: #f0f0f0;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 14px 0;
    font-weight: 600;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .label {
    font-size: 13px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #555;
    transition: 0.2s;
    border-radius: 22px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.2s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: #3ba55d;
  }
  input:checked + .slider:before {
    transform: translateX(18px);
  }
  .stats {
    background: #2b2d31;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stats .count {
    font-size: 26px;
    font-weight: 700;
  }
  .stats .caption {
    font-size: 11px;
    color: #aaa;
    margin-top: 2px;
  }
  button.reset {
    margin-top: 10px;
    width: 100%;
    padding: 6px;
    border: none;
    border-radius: 6px;
    background: #3a3c40;
    color: #ddd;
    font-size: 12px;
    cursor: pointer;
  }
  button.reset:hover {
    background: #46484d;
  }
</style>
</head>
<body>
  <h1>Tab Guard</h1>
  <div class="row">
    <span class="label">Protection</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="stats">
    <div class="count" id="count">0</div>
    <div class="caption">unwanted tabs blocked</div>
  </div>
  <button class="reset" id="reset">Reset count</button>
  <script src="popup.js"></script>
</body>
</html>
